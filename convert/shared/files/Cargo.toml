[package]
name = "convert-files"
description = "What a files-in, files-out tool shares: the browser exports, the desktop program, settings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
convert-zip = { workspace = true, features = ["deflate"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
