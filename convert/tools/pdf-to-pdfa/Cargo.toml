[package]
name = "pdf-to-pdfa"
description = "Convert a PDF to PDF/A-2b for archiving, and say what is not conformant"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "pdf-to-pdfa"
path = "src/main.rs"

[dependencies]
convert-pdfdoc.workspace = true
convert-pdftool.workspace = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
