[package]
name = "pdf-to-markdown"
description = "PDF to Markdown (GitHub-flavoured)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "pdf-to-markdown"
path = "src/main.rs"

[dependencies]
convert-structure = { workspace = true, features = ["pictures"] }
convert-wasm.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
convert-cli.workspace = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
