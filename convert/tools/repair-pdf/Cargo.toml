[package]
name = "repair-pdf"
description = "Rebuild a damaged PDF: a true cross-reference, recovered objects and pages"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "repair-pdf"
path = "src/main.rs"

[dependencies]
convert-pdfdoc.workspace = true
convert-pdftool.workspace = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
