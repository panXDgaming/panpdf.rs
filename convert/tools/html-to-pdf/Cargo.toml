[package]
name = "html-to-pdf"
description = "An HTML page and its local pictures and styles to PDF, with Lao and Thai set right"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "html-to-pdf"
path = "src/main.rs"

[dependencies]
convert-layout = { workspace = true, features = ["svg"] }
convert-structure.workspace = true
convert-gif.workspace = true
convert-svg.workspace = true
convert-wasm.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
convert-cli.workspace = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
