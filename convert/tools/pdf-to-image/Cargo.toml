[package]
name = "pdf-to-image"
description = "PDF pages to JPG or PNG pictures, or the pictures a PDF holds"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "pdf-to-image"
path = "src/main.rs"

[dependencies]
convert-files.workspace = true
convert-raster = { workspace = true, features = ["files", "paint"] }
pdf-bytes.workspace = true
pdf-content.workspace = true
pdf-paint.workspace = true
pdf-render.workspace = true
pdf-session.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
convert-cli.workspace = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
