[package]
name = "compare-pdf"
description = "Compare two PDFs: the words added and removed on each page, and a picture of what changed"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "compare-pdf"
path = "src/main.rs"

[dependencies]
convert-pdftool.workspace = true
convert-structure.workspace = true
pdf-content.workspace = true
pdf-edit.workspace = true
pdf-render.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
convert-cli.workspace = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
