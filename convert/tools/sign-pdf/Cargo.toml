[package]
name = "sign-pdf"
description = "Put a drawn, typed or pictured signature on chosen pages of a PDF"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "sign-pdf"
path = "src/main.rs"

[dependencies]
convert-pdfdoc.workspace = true
convert-pdftool.workspace = true
pdf-bytes.workspace = true
pdf-content.workspace = true
pdf-paint.workspace = true
pdf-edit.workspace = true
pdf-session.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
convert-cli.workspace = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
