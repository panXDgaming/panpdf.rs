[package]
name = "powerpoint-to-pdf"
description = "PowerPoint presentations (.pptx) to PDF, one page per slide"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "powerpoint-to-pdf"
path = "src/main.rs"

[dependencies]
convert-structure.workspace = true
convert-office-read.workspace = true
convert-pdf-canvas.workspace = true
convert-drawingml.workspace = true
convert-wasm.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
convert-cli.workspace = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
